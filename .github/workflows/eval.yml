name: Eval

## Runs the evals in evals/prompts/*.yaml. Triggered by:
#   - schedule: every day against the default branch, grading the configs that
#       are due: each one whose SKILL.md, eval config or harness changed since
#       its last graded run, then each one last graded EVAL_REGRADE_DAYS or more
#       ago, which is what shows a provider changing a model behind its pinned
#       id. As many as one day of the Groq key's generator tokens holds; the
#       rest are first the next day. A day with nothing due runs nothing.
#   - workflow_dispatch: a maintainer validates a branch or PR, pre- or post-merge.
#       ref      – branch, or refs/pull/<N>/head for a fork PR. Blank = default branch.
#       configs  – space-separated evals/prompts/*.yaml. Blank = every config
#                  whose inputs on that ref changed since its last graded run.
#       baseline – run with the skill withheld (injectSkill=false). Gap-targeting
#                  prompts are expected to FAIL here; a negative test should PASS.
#
# Runs in this repo's own Actions context with its secrets regardless of ref —
# see evals/README.md → CI before dispatching against an unreviewed ref.
#
# Each config runs under a time bound drawn from the run budget
# (EVAL_BUDGET_MINUTES below) and reports one of three verdicts: pass, fail, or
# error. `error` means no graded verdict — a provider or judge failure, a
# config the bound cut off, or one the budget never reached — and never moves a
# skill's `status:` field. A config the generator's or the judge's daily limit
# cut off is an `error` that does not fail the run; it goes first the next day.

on:
  schedule:
    # Every day, each run grading what is due, as much of it as the day holds;
    # scripts/run-evals.js plans each one. 10:17 UTC: low API traffic, and
    # off-:00 so GitHub doesn't drop it.
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to evaluate (blank = default branch; fork PR = refs/pull/<N>/head)'
        required: false
        default: ''
      configs:
        description: 'Space-separated evals/prompts/*.yaml paths (blank = every config changed since its last graded run)'
        required: false
        default: ''
      baseline:
        description: 'Withhold the skill (baseline run) — targeting prompts should FAIL'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    # A backstop under GitHub's 360-minute default, not the working bound: a job
    # GitHub kills writes no outputs at all, which is how the 2026-08-30 run
    # spent six hours and left no evidence. The per-config bound below is what
    # should end a bad run.
    timeout-minutes: 300
    # Checks out inputs.ref, arbitrary on dispatch, so it holds the API secrets
    # but no write token. Repo writes are in the publish job.
    permissions:
      contents: read
    outputs:
      name: ${{ steps.run.outputs.name }}
      ran: ${{ steps.run.outputs.ran }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Every skill with an eval config. Globbing rather than a hardcoded list:
      # a new skill is covered the moment its config lands.
      #
      # One promptfoo invocation per config — never combine them. Promptfoo
      # merges the defaultTest blocks of combined configs (last one wins),
      # which would inject a single skill's SKILL.md into every test.
      #
      # The runner sets PROMPTFOO_MAX_EVAL_TIME_MS per child, so a config that
      # overruns finalizes with ERROR rows and still writes both outputs. Each
      # child may use what the budget has left after the least time the configs
      # planned after it need, their requests at the pace the measured
      # per-minute limit sets; the budget lives here so it is visible in YAML.
      - name: Run evals
        id: run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          INPUT_CONFIGS: ${{ inputs.configs }}
          INPUT_BASELINE: ${{ inputs.baseline }}
          EVAL_WORK_DIR: ${{ runner.temp }}/eval
          EVAL_BUDGET_MINUTES: 240
          # The Groq key's generator tokens per day: its free tier's published
          # limit, the one limit Groq does not report back. A run that meets a
          # lower one stops there and says so. The per-minute limit is measured
          # every run.
          EVAL_TOKENS_PER_DAY: 200000
          # An unchanged config is graded again once its last grade is this
          # many days old, on scheduled runs only: theirs are the grades the
          # publish job commits, so a dispatch grades only what changed.
          EVAL_REGRADE_DAYS: ${{ github.event_name == 'schedule' && 7 || 0 }}
        run: node scripts/run-evals.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            evals/results/*.csv
            evals/results/*.json

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-verdicts-${{ github.run_id }}
          path: ${{ runner.temp }}/eval
          if-no-files-found: ignore

  # Repo writes, scheduled runs only: checks out the default branch, never a
  # dispatched ref. always() so a failed eval still opens its issue.
  publish:
    needs: eval
    # A day that graded nothing has nothing to publish.
    if: always() && github.event_name == 'schedule' && needs.eval.outputs.ran != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      name: ${{ needs.eval.outputs.name }}
    steps:
      # The branch tip, not the trigger SHA a scheduled run checks out by
      # default: main moves while the eval job runs, and a push from the trigger
      # SHA is then rejected as non-fast-forward.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results

      - name: Download verdicts
        uses: actions/download-artifact@v8
        with:
          name: eval-verdicts-${{ github.run_id }}
          path: ${{ runner.temp }}/eval

      - name: Commit results
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # The run's dated CSVs, and its record of what each config was graded
          # on, which the next run plans from. A config the day cut off left no
          # CSV, so a run may have none.
          shopt -s nullglob
          git add evals/results/${{ env.name }}.json evals/results/${{ env.name }}-*.csv
          git diff --staged --quiet || git commit -m "chore: eval results ${{ env.name }}"
          git pull --rebase
          git push

      # Flips status: provisional -> verified on pass, status: verified -> provisional
      # on fail, for whichever skills opted in with a status field. This is the
      # drift check's verdict, not a fresh baseline+with-skill pair — see
      # scripts/sync-skill-status.js.
      - name: Sync skill status from drift check
        id: sync
        run: node scripts/sync-skill-status.js "$RUNNER_TEMP/eval/verdicts.txt"

      - name: Commit status changes
        id: status_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add skills/*/SKILL.md
          git diff --staged --quiet || git commit -m "chore: sync skill status from ${{ env.name }} drift check"
          git pull --rebase
          git push

      # Reads the run's own record and says what this run was, so the issue
      # below opens with a verdict instead of a checklist. always() because the
      # runs worth classifying are exactly the ones where a step above failed.
      - name: Classify the run
        id: classify
        if: always()
        env:
          EVAL_RESULT: ${{ needs.eval.result }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          STATUS_COMMIT_OUTCOME: ${{ steps.status_commit.outcome }}
          SYNC_PARTIAL: ${{ steps.sync.outputs.partial }}
        run: node scripts/eval-issue.js

      # A status flip is expected-by-design behavior, not a failure — this is a
      # "review this" notice, separate from the eval-drift issue below which
      # means "something might be wrong."
      - name: Open issue on status change
        if: steps.sync.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = process.env.SUMMARY;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Skill status changed — ${date}`,
              body: [
                `The drift check flipped one or more skills' \`status\` field.`,
                ``,
                '```',
                summary,
                '```',
                ``,
                `[Workflow run](${run})`,
                ``,
                `A **provisional -> verified** flip means the skill's with-skill run passed; the`,
                `baseline (skill-withheld) evidence for the original launch bar isn't re-checked`,
                `by the drift check, so confirm that still holds before treating this as a full verification.`,
                ``,
                `A **verified -> provisional** flip means a previously-passing skill just failed.`,
                `Triage it the same way as an eval-drift issue: rule out infrastructure and`,
                `sampling noise before treating it as a real regression.`,
              ].join('\n'),
              labels: ['skill-status-change']
            })

      # The eval passed but publishing its results did not (push rejected, sync
      # threw, artifact download flaked). Distinct from the drift issue below,
      # which covers the eval job itself; guarded so a failed eval opens one issue, not two.
      - name: Open issue on publish failure
        if: failure() && needs.eval.result == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Eval publish step failed — ${date}`,
              body: [
                `The scheduled eval ran and passed, but the publish job failed after it, so the results CSVs and any status flip may not have landed.`,
                ``,
                `[Workflow run](${run})`,
                ``,
                `Check the failed step in the run log:`,
                `- **Commit results / Commit status changes** — a rejected \`git push\` usually means \`main\` moved during the run; re-running the workflow is enough.`,
                `- **Sync skill status** — \`scripts/sync-skill-status.js\` threw; the log has the reason.`,
                `- **Download results / Download verdicts** — the artifact upload or download flaked; re-run.`,
              ].join('\n'),
              labels: ['eval-publish']
            })

      # This run watches for drift — a provider silently updating a model behind a
      # pinned ID. So the issue asks a question; it does not assert a cause.
      # The classification block above the questions reports what the run did,
      # which is not the same as why. `!= 'success'` rather than `== 'failure'`
      # so a cancelled job — a job-level timeout — opens an issue too.
      - name: Open issue on failure
        if: always() && needs.eval.result != 'success'
        uses: actions/github-script@v9
        env:
          HEADLINE: ${{ steps.classify.outputs.headline }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const headline = process.env.HEADLINE || 'investigate: infra, noise, or drift?';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Eval drift check: ${headline} — ${date}`,
              body: [
                process.env.CLASSIFICATION || '',
                ``,
                `---`,
                ``,
                `The eval drift check failed. **This is not yet a regression** — triage it before treating it as one.`,
                ``,
                `[Workflow run](${run})`,
                ``,
                `Rule these out, in order:`,
                `1. **Infrastructure** — a \`503\`/\`UNAVAILABLE\` from the generator, or \`429\`/rate-limiting from the judge, fails a test for reasons that have nothing to do with content. The exception is \`request-too-large\`: that prompt fills the generator's per-minute limit on its own, so it fails every run until the skill or the test prompt is shortened, and \`npm run lint:prompt-budget\` names it.`,
                `2. **Sampling noise** — the generator is nondeterministic even at temperature 0, so a test near the rubric boundary can flip on its own. The run already re-ran up to two failing tests per config twice each, and the Signals column lists every attempt: a test that failed once and passed both re-runs flipped on its own, and the fix is to close the gap in the skill or the rubric that leaves its answer on the boundary; one that failed every attempt is reproducible. Re-run by hand only a config the run did not.`,
                `3. **Drift** — if it reproduces, a provider may have silently updated a model behind its pinned ID. That is what this check exists to catch.`,
                `4. **Actual regression** — only plausible if a skill or its prompts changed since the last green run.`,
              ].join('\n'),
              labels: ['eval-drift']
            })
