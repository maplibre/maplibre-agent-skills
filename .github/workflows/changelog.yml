name: Changelog

on:
  push:
    branches: [main]

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  accrue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The branch tip, not the pushed commit: when PRs merge in a burst, a run
      # can start after newer merges, and only the tip's CHANGELOG.md says which
      # of them are already recorded.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Find merged PRs the changelog lacks
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PRS_FILE: ${{ runner.temp }}/prs.json
        run: node scripts/merged-pr.js

      - name: Record the changelog entries
        id: accrue
        if: steps.pr.outputs.found == 'true'
        env:
          PRS_FILE: ${{ runner.temp }}/prs.json
        run: |
          node scripts/accrue-changelog.js
          npx prettier --write CHANGELOG.md

      - name: Commit
        if: steps.pr.outputs.found == 'true'
        env:
          RECORDED: ${{ steps.accrue.outputs.recorded }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(changelog): record ${RECORDED}"
          git pull --rebase

      # check.yml never sees this push (GITHUB_TOKEN pushes start no workflows),
      # so its checks run here, after the rebase, on the tree that gets pushed.
      - name: Check before pushing
        if: steps.pr.outputs.found == 'true'
        run: |
          npm run format:check
          npm run spellcheck
          npm run lint:markdown
          npm run validate:skills

      - name: Push
        if: steps.pr.outputs.found == 'true'
        run: git push

  tag:
    needs: accrue
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for a version change
        id: version
        run: node scripts/version-changed.js

      - name: Tag and publish the release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi
          node scripts/changelog-section.js "$VERSION" > "$RUNNER_TEMP/notes.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
