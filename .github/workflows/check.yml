name: Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Spell check
        run: npm run spellcheck

      - name: Lint markdown
        run: npm run lint:markdown

      - name: Check terminology
        run: npm run lint:terminology

      - name: Check model pins
        run: npm run lint:model-pins

      - name: Check eval request sizes
        run: npm run lint:prompt-budget

      - name: Check eval tripwires
        run: npm run lint:tripwires

      - name: Validate skills
        run: npm run validate:skills

      - name: Unit tests
        run: npm test
