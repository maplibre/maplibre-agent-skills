# Evals for the maplibre-dem-sources skill.
# Run commands and provider setup: evals/README.md
# Per-test verdicts and what has not been run: evals/results/maplibre-dem-sources.md

description: Evals for the maplibre-dem-sources skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-dem-sources/SKILL.md

tests:
  - description: explicit — the pixel formula each raster-dem encoding decodes with
    vars:
      prompt: >
        I am producing my own elevation tiles from a GeoTIFF and I have to pick
        which RGB packing to write. What exact per-pixel formula does MapLibre
        GL JS use to turn a raster-dem tile's red, green, and blue values back
        into meters, for each encoding it accepts?
    assert:
      - type: icontains
        value: '32768'
      - type: llm-rubric
        value: >
          Must give the Terrarium formula as (red * 256 + green + blue / 256) -
          32768. Must give the Mapbox Terrain-RGB formula as -10000 + ((red *
          256 * 256 + green * 256 + blue) * 0.1). Must state that the source's
          `encoding` property selects between them and that its default value
          is "mapbox". Must not present a single formula as if it applied to
          both encodings, and must not claim MapLibre detects the encoding from
          the tile itself.

  - description: implicit — terrain renders as garbage because the encoding was left at its default
    vars:
      prompt: >
        I wired up 3D terrain in MapLibre GL JS against the AWS Open Data
        elevation tiles at
        https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png
        and pitched the camera. Instead of mountains I get a violently spiky
        surface, with sheer walls where the coastline is and flat ground where
        the peaks should be. Nothing shows up in the console. Here is my
        source:

        { "type": "raster-dem", "url": "...", "tileSize": 256 }
    assert:
      - type: llm-rubric
        value: >
          Must identify the cause as an encoding mismatch: these tiles carry
          Terrarium-packed elevation, MapLibre's raster-dem `encoding` property
          defaults to "mapbox" (Terrain-RGB), and the source above never sets
          it. Must give the fix as adding `encoding: "terrarium"` to the source.
          Must state that the mismatch produces wrong elevations silently, with
          no console error, because both packings are valid PNG pixels. Must not
          attribute the symptom primarily to `exaggeration`, `tileSize`, the
          camera pitch, or a corrupt tileset.

  - description: anti-pattern — a pre-rendered hillshade image wired as a raster-dem source
    vars:
      prompt: >
        Our imagery vendor publishes a hillshade endpoint at
        https://tiles.example.com/hillshade/{z}/{x}/{y}.jpg. I registered it as
        a raster-dem source and called map.setTerrain() on it. The relief
        picture is what I want in the end, so is this the right way to wire it
        up?
    assert:
      - type: llm-rubric
        value: >
          Must say no, and must explain why: a raster-dem source requires tiles
          whose pixels encode elevation numerically (Terrarium or Mapbox
          Terrain-RGB packing, in a lossless format such as PNG or WebP), while
          this endpoint serves a picture of shading that has no elevation values
          left in it. Must note that JPEG is lossy and cannot carry a per-pixel
          elevation packing even in principle. Must give the correct wiring for
          this endpoint as an ordinary `raster` source and `raster` layer, and
          must state that 3D terrain, client-side hillshade, and color-relief
          need a real elevation tileset instead. Must not treat the word
          "hillshade" in the URL as evidence that the tiles are raster-dem.

  - description: negative — adjacent question about plain satellite imagery tiles
    vars:
      prompt: >
        I have a satellite imagery tile service at
        https://tiles.example.com/imagery/{z}/{x}/{y}.jpg with 256px tiles, and
        I want it as the bottom layer of my MapLibre GL JS map. How do I add it?
    assert:
      - type: llm-rubric
        value: >
          Must answer the question asked: a `raster` source with a `tiles`
          array and `tileSize: 256`, plus a `raster` layer placed at the bottom
          of the layer list. Must not tell the developer to use a `raster-dem`
          source, to set an `encoding`, or to call `setTerrain` for this, and
          must not treat plain imagery as elevation data.
