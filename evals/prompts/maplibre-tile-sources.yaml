# Evals for the maplibre-tile-sources skill.
# See evals/README.md for run commands and provider setup.
#
# This skill was narrowed to the source-selection question. Three tests that
# targeted content now in maplibre-source-wiring moved to that skill's config:
# the custom-style source-layer test, the addLayer label-order test, and the
# missing-glyphs test. Their prior results are in
# evals/results/example-tile-sources.md.
#
# Tests 1 and 4 below are unchanged and previously recorded (baseline 0.50 and
# 1.00, with-skill 1.00 and 1.00). Tests 2 and 3 are new and NOT yet validated
# — no baseline run has been recorded for them.
#
# Tests 5-7 are new and NOT yet run — no baseline recorded.

description: Evals for the maplibre-tile-sources skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-tile-sources/SKILL.md

tests:
  - description: explicit — GeoJSON vs tiles decision for a real scenario
    vars:
      prompt: >
        I have about 8,000 hiking trail segments stored as GeoJSON, and
        users need to click a trail to see its name and distance. I also
        need a basemap showing terrain and roads. How should I set up the
        data sources in MapLibre — do I need vector tiles, or can I use
        GeoJSON?
    assert:
      - type: llm-rubric
        value: >
          Must treat 8,000 features as a gray zone — not a clean
          "use GeoJSON" or "use vector tiles" answer — and explain
          the tradeoffs rather than jumping straight to a recommendation.
          Must explain at least two of the following tradeoffs: GeoJSON
          downloads the entire dataset on load (parse time grows with
          feature count); GeoJSON gives full client-side attribute access
          without a server round-trip, which benefits click/hover
          interactions; vector tiles load only the visible viewport but
          require generating and hosting tile infrastructure. Must explain
          why GeoJSON is still a defensible choice for this scenario:
          the dataset is interactive (click to see properties), which
          favors GeoJSON's full attribute access, and the dataset size is
          in the range where optimization (simplify geometries, reduce
          coordinate precision) can keep load time acceptable. Must
          describe the combination pattern: use a hosted basemap style URL
          for terrain and roads, and add the trail data as a separate
          GeoJSON source. Must not recommend building a custom tile server
          or vector tile pipeline as the primary solution without
          acknowledging that GeoJSON is a viable alternative here.

  - description: implicit — dataset outgrew GeoJSON without the user naming tiles
    vars:
      prompt: >
        My parcel layer is a 180 MB GeoJSON file with around 400,000
        polygons. The browser hangs for ages on load and sometimes the tab
        just dies. I've already tried minifying the JSON. What now?
    assert:
      - type: llm-rubric
        value: >
          Must identify that this dataset is far past what a GeoJSON source
          can handle — the whole file downloads and parses in the browser on
          every load — and that no amount of minification fixes that.
          Must recommend vector tiles as the answer, naming a generation
          tool (tippecanoe or Planetiler). Must not offer only incremental
          GeoJSON optimizations (simplifying geometry, trimming coordinate
          precision, pagination) as the primary fix at this size.

  - description: anti-pattern — merging basemap and application data into one tileset
    vars:
      prompt: >
        I want my roads, water, labels, and my own delivery-zone polygons
        all in a single vector tileset so the map only hits one source.
        What's the best pipeline to merge OpenStreetMap data with my
        polygons and build that combined tileset?
    assert:
      - type: llm-rubric
        value: >
          Must push back on merging application data into the basemap
          tileset rather than simply supplying the requested pipeline.
          Must explain that the basemap and the user's own data are
          normally separate sources: a style can hold any number of
          sources, the basemap supplies context while the user's source
          supplies their data, and merging means regenerating the whole
          tileset whenever the user's data changes. Must describe the
          standard pattern instead — a hosted basemap style URL or vector
          source, plus the delivery zones as a separate GeoJSON or vector
          source. May acknowledge that a single combined tileset is
          defensible only when self-hosting with full control of the
          pipeline.

  - description: negative — small dataset, no tile server needed
    vars:
      prompt: >
        I'm building a store locator for about 50 locations across the US.
        Do I need to set up a vector tile server for this?
    assert:
      - type: llm-rubric
        value: >
          Must say that 50 locations is well within the GeoJSON sweet spot
          (under 5,000 features) and does NOT require a tile server or
          vector tile infrastructure. Must not recommend setting up a tile
          server, PMTiles pipeline, or tile generation workflow for a
          dataset this small. May suggest GeoJSON source or markers.

  - description: implicit — georeferencing a scanned image, not a tile or GeoJSON source
    vars:
      prompt: >
        I have a scanned 1920s map of my city as a JPG, and I know the
        lat/lon coordinates of its four corners. I want to overlay it on my
        MapLibre map at the correct location and let users toggle its
        opacity. What's the right way to add this?
    assert:
      - type: icontains
        value: coordinates
      - type: llm-rubric
        value: >
          Must recommend MapLibre's `image` source type, not a GeoJSON
          source and not a raster tile source. Must mention specifying the
          four corner `coordinates` for georeferencing. Must not recommend
          converting the scanned map into a raster tileset as the primary
          approach for a single one-off image. May mention `raster-opacity`
          on the resulting raster layer for the opacity toggle.

  - description: explicit — vector tiles for a restylable basemap, not raw performance
    vars:
      prompt: >
        I want to offer both a light and dark theme for my basemap,
        switchable at runtime, without hosting two separate sets of tiles.
        What tile type should my basemap use?
    assert:
      - type: icontains
        value: vector
      - type: llm-rubric
        value: >
          Must recommend vector tiles, and must justify it specifically by
          the ability to restyle client-side without regenerating or
          re-hosting the underlying tile data. Must explain that raster
          tiles are pre-rendered images baked with one look, so a second
          theme would require generating and hosting a second raster
          tileset. Must not recommend raster tiles as the primary answer.

  - description: implicit — Leaflet cannot render vector tiles natively
    vars:
      prompt: >
        My app is built on Leaflet and I want to add a MapLibre-style
        vector tile basemap to it. Is that possible, and how?
    assert:
      - type: icontains
        value: maplibre-gl-leaflet
      - type: llm-rubric
        value: >
          Must state that Leaflet itself only renders raster tiles and
          cannot directly consume a vector tile source. Must recommend a
          MapLibre-to-Leaflet integration (such as the maplibre-gl-leaflet
          plugin) that renders the MapLibre style and displays it as a
          raster layer inside Leaflet. Must not claim Leaflet can natively
          render vector tiles without such a plugin.
