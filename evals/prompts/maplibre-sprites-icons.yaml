# Evals for the maplibre-sprites-icons skill.
#
# Run locally (Groq — set GROQ_API_KEY):
#   npm run eval:graded -- --config evals/prompts/maplibre-sprites-icons.yaml
#
# IMPORTANT: let lib/providers.yaml choose the provider on any recorded run. --providers
# replaces the pinned generator and drops its config (temperature, max_tokens) unless the
# value matches a configured id or label. Fine for ad-hoc probes: --providers echo.
#
# Suite created 2026-09-09 with the skill, which was extracted out of maplibre-cartography
# (issue #68). Test 1 moved here verbatim from evals/prompts/maplibre-cartography.yaml with
# the shield content it targets; its earlier history is in evals/results/maplibre-cartography.md.

description: Evals for the maplibre-sprites-icons skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-sprites-icons/SKILL.md

tests:
  - description: explicit — route shields missing badge on the open OpenMapTiles stack
    vars:
      prompt: "I'm using an open OpenMapTiles / OSM-based vector basemap with MapLibre GL JS (no Mapbox account). My interstate and US highway shields render as bare floating numbers with no shield badge behind them; the numbers are fine. My tiles do populate network, ref, and ref_length. Which exact sprite image names do the shield layers expect, and how do I get the badges to appear without editing the layers?"
    assert:
      - type: icontains
        value: 'ref_length'
      # Deterministic tripwires: baseline hallucinates a "road_shield_N" scheme
      # and never produces the real key names, and the Cerebras self-judge
      # believes the hallucination — so don't rely on the rubric alone.
      - type: icontains
        value: 'us-interstate'
      - type: not-icontains
        value: 'road_shield'
      - type: llm-rubric
        value: "Correctly states that OpenMapTiles/OSM Liberty shield layers reference icon-image by the pattern \"{network}_{ref_length}\" for known networks — e.g. us-interstate_2, us-highway_3, us-state_2 — and road_{ref_length} for generic refs, and that a missing icon is silently omitted. The fix is to point the style's sprite at one that actually contains those shield images (so the {network}_{ref_length} layers resolve with no layer edits). Must NOT invent a different naming scheme (e.g. \"road_shield_{ref}\") and must NOT tell the user to use a Mapbox sprite / mapbox:// URL or a Mapbox account."

  - description: implicit — own icon sheet alongside the basemap provider's, icons never appear
    vars:
      prompt: "My MapLibre GL JS style's sprite points at my basemap provider's URL. I host my own sheet of POI icons on my own domain, and I set icon-image on my symbol layer to one of my icon names. The basemap's own icons all render fine, but mine never appear and nothing logs an error. I'd rather not merge the two sheets or rebuild them. How do I get my symbol layers to reference the icons in my sheet?"
    assert:
      - type: llm-rubric
        value: "Must state that the style spec's `sprite` accepts an ARRAY of `{id, url}` objects (not only a string), and show that array form with both sheets. Must state that `icon-image` references an image from a named sheet with the `id:image-name` prefix (e.g. `my-icons:cafe`), that ids and URLs must each be unique, and that the id `default` is the one exception whose images take no prefix. Must NOT claim a style can only have one sprite, and must NOT present merging/rebuilding the two sheets into one (spreet, spritezero, addImage) as the only or primary option."

  - description: anti-pattern — shield detection heuristic that ignores icon-text-fit
    vars:
      prompt: "Reviewing my style-audit script. It flags a MapLibre symbol layer as a route shield when layer.layout['text-anchor'] === undefined and layer.layout['symbol-placement'] === 'point'. It is tagging plain place-name layers as shields and skipping real shield layers. Is the heuristic sound, and what should it key off instead?"
    assert:
      - type: icontains
        value: 'icon-text-fit'
      - type: llm-rubric
        value: "Must name `icon-text-fit` set to a value other than `none` (its default) as THE definitional property that identifies a shield — the badge is an icon scaled around the text, which is what `icon-text-fit` does, so no other layout property is definitional. Must NOT put forward a sprite or `icon-image` name pattern (e.g. matching /shield/), a `text-field` token such as {ref}, an overlap flag, or a layer-id naming convention as the primary discriminator, and must NOT demote `icon-text-fit` to one optional cue in a list of equally weighted signals. May also note that `text-anchor` defaults to `center` so its absence carries no information, and that `symbol-placement` can be an expression or legacy zoom function rather than a bare string."

  - description: negative — out-of-scope question about HTML markers and popups
    vars:
      prompt: 'How do I place a draggable pin at a coordinate in MapLibre GL JS and show a popup when the user clicks it?'
    assert:
      - type: icontains
        value: 'Marker'
      - type: llm-rubric
        value: "Answers the marker question directly: constructs a maplibregl.Marker (draggable via the `draggable` constructor option or setDraggable), positions it with setLngLat, attaches a Popup with setPopup, and adds it with addTo(map). Grade the substance of the answer, not its completeness. Must NOT redirect the user into building or editing a sprite sheet, changing the style's `sprite` property, or adding a symbol layer with icon-image, as if any of that were required to place a draggable pin."
