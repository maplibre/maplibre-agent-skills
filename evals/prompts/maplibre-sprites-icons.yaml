description: Evals for the maplibre-sprites-icons skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-sprites-icons/SKILL.md

tests:
  - description: explicit — route shields missing badge on the open OpenMapTiles stack
    vars:
      prompt: "I'm using an open OpenMapTiles / OSM-based vector basemap with MapLibre GL JS (no Mapbox account). My interstate and US highway shields render as bare floating numbers with no shield badge behind them; the numbers are fine. My tiles do populate network, ref, and ref_length. Which exact sprite image names do the shield layers expect, and how do I get the badges to appear without editing the layers?"
    assert:
      - type: icontains
        value: 'us-interstate_'
      - type: llm-rubric
        value: "Correctly states that OSM Bright's shield layers reference icon-image by the pattern \"{network}_{ref_length}\" for US networks — e.g. us-interstate_2, us-highway_3, us-state_2 — and road_{ref_length} for other refs, and that a missing icon is omitted. The fix is to point the style's sprite at one that actually contains those shield images (so the {network}_{ref_length} layers resolve with no layer edits). Must NOT present us-highway_4, us-highway_5, us-highway_6, or us-interstate_6 as images either OSM Bright sheet carries; both sheets stop at us-highway_3 and us-interstate_3 (us-interstate_5 on openmaptiles.github.io). Must NOT invent a different naming scheme (e.g. \"road_shield_{ref}\") and must NOT tell the user to use a Mapbox sprite / mapbox:// URL or a Mapbox account."

  - description: implicit — own icon sheet alongside the basemap provider's, icons never appear
    vars:
      prompt: "My MapLibre GL JS style's sprite points at my basemap provider's URL. I host my own sheet of POI icons on my own domain, and I set icon-image on my symbol layer to one of my icon names. The basemap's own icons all render fine, but mine never appear and nothing logs an error. I'd rather not merge the two sheets or rebuild them. How do I get my symbol layers to reference the icons in my sheet?"
    assert:
      - type: llm-rubric
        value: "Must state that the style spec's `sprite` accepts an ARRAY of `{id, url}` objects (not only a string), and show that array form with both sheets. Must state that `icon-image` references an image from a named sheet with the `id:image-name` prefix (e.g. `my-icons:cafe`), that ids and URLs must each be unique, and that the id `default` is the one exception whose images take no prefix. Must NOT claim a style can only have one sprite, and must NOT present merging/rebuilding the two sheets into one (spreet, spritezero, addImage) as the only or primary option."

  - description: implicit — SVG category icons for a GeoJSON venue layer
    vars:
      prompt: "MapLibre GL JS 6. I have about 40 category icons as SVG files served from my own site, and a GeoJSON source of roughly 5,000 venues, each with a `category` property. Every venue should show its category's icon, and zoomed out the icons shouldn't pile up on top of each other. Show me the code that loads the icons and draws the venues."
    assert:
      - type: llm-rubric
        value: "Must draw the venues with a symbol layer on the GeoJSON source whose `icon-image` is data-driven from `category` (for example `['get', 'category']`), not with one `Marker` per venue. Must turn each SVG into a style image by loading it into an `HTMLImageElement` (`new Image()`), waiting for it to load, and passing that element, or pixels drawn from it, to `map.addImage`, or else by building a sprite from the SVGs ahead of time. Must not pass an SVG file or a `data:image/svg+xml` URL to `map.loadImage()`, which accepts only PNG, WebP, and JPEG. Must not call `map.loadImage(url, callback)`: since MapLibre GL JS 4.0.0 it returns a promise and takes no callback. Must state that icons which collide are hidden by default (`icon-allow-overlap` defaults to `false`). Must not present `icon-optional` as what hides overlapping icons; it only lets a symbol's text show without its icon. Must register the SVG rasters as ordinary images (`sdf` off or omitted), and must not set `sdf: true` on them: an ordinary image marked SDF has its alpha read as a distance field and every opaque pixel painted `icon-color`, so the category icons lose their colors."

  - description: anti-pattern — shield detection that compares symbol-placement as a string
    vars:
      prompt: "Reviewing my style-audit script. It flags a MapLibre symbol layer as a route shield when layer.layout['text-anchor'] === undefined and layer.layout['symbol-placement'] === 'point'. It is tagging plain place-name layers as shields and skipping real shield layers. Is the heuristic sound, and what should it key off instead?"
    assert:
      - type: icontains-any
        value:
          - "zoom function"
          - "zoom-function"
          - "zoom\u2011function"
      - type: llm-rubric
        value: "Must state that `text-anchor` defaults to `center`, so its absence says nothing about a layer. Must state that `symbol-placement` is not always a bare string: shield layers in styles such as OSM Bright set it with a legacy `{stops}` zoom function, and any layout value can be an expression, so comparing it to 'point' skips them. Must key the audit off what a shield draws, an `icon-image` badge behind a route-ref `text-field`, and name both forms that badge takes, accepting either: a pre-drawn image per ref length (such as `road_{ref_length}` or `{network}_{ref_length}`) and a single stretchable image sized with `icon-text-fit`. Must not make `icon-text-fit` a requirement for a layer to count as a shield."

  - description: negative — a draggable pin with a popup stays a Marker
    vars:
      prompt: 'How do I place a draggable pin at a coordinate in MapLibre GL JS and show a popup when the user clicks it?'
    assert:
      - type: icontains
        value: 'Marker'
      - type: llm-rubric
        value: "Answers the marker question directly: constructs a maplibregl.Marker (draggable via the `draggable` constructor option or setDraggable), positions it with setLngLat, attaches a Popup with setPopup, and adds it with addTo(map). Grade the substance of the answer, not its completeness. Must NOT redirect the user into building or editing a sprite sheet, changing the style's `sprite` property, or adding a symbol layer with icon-image, as if any of that were required to place a draggable pin."
