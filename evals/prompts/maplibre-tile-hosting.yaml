# Evals for the maplibre-tile-hosting skill.
# See evals/README.md for run commands and provider setup.
#
# NOTE: these tests are drafted, not yet validated. No baseline run has been
# recorded, so it is not yet established that the model fails any of them
# without the skill. See CONTRIBUTING.md — a skill earns its place through a
# demonstrated gap, and that gap has not been demonstrated here.

description: Evals for the maplibre-tile-hosting skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-tile-hosting/SKILL.md

tests:
  - description: anti-pattern — using tile.openstreetmap.org in production
    vars:
      prompt: >
        I'm launching a store locator next month and I've got my raster
        basemap pulling from https://tile.openstreetmap.org/{z}/{x}/{y}.png.
        It works great in testing. Anything I should know before launch?
    assert:
      - type: icontains
        value: tile.openstreetmap.org
      - type: llm-rubric
        value: >
          Must clearly state that tile.openstreetmap.org must NOT be used in
          production — the OpenStreetMap Foundation's tile usage policy
          prohibits bulk and high-traffic use, and violating it gets the
          IP blocked. Must direct the user to an alternative: a hosted
          provider (e.g. OpenFreeMap, MapTiler), serverless PMTiles on static
          storage, or self-hosting. Must not treat this as merely a
          performance or attribution concern, or suggest caching or a proxy
          as a way to keep using the OSM tile server.

  - description: explicit — choosing between hosting approaches
    vars:
      prompt: >
        We have a fixed dataset for one US state that we regenerate maybe
        twice a year. No ops team. What are our options for getting these
        tiles on the web, and which would you pick?
    assert:
      - type: llm-rubric
        value: >
          Must lay out the distinct approaches — static/serverless file
          hosting (PMTiles on S3, R2, or GitHub Pages), a hosted tile
          provider, and a self-hosted tile server — rather than naming only
          one. Must recommend the serverless/static PMTiles path for this
          scenario and justify it with the stated facts: the dataset is
          bounded, rarely updated, and there is no ops capacity. Must NOT
          recommend standing up and maintaining a tile server (Martin,
          tileserver-gl) as the primary answer for this case.

  - description: implicit — attribution obligation on OSM-derived tiles
    vars:
      prompt: >
        We're using a free OpenStreetMap-based vector basemap from a hosted
        provider for our commercial dashboard. Legal asked what our
        obligations are. What do I tell them?
    assert:
      - type: llm-rubric
        value: >
          Must state that OpenStreetMap data is licensed under the ODbL and
          that attribution is required, at the same visual prominence as any
          other credit on the map. Must mention the share-alike obligation:
          producing an adapted database from OSM data requires releasing it
          under ODbL as well. Should note that free/community-funded services
          also carry their own usage policies to respect. Must not answer
          that a commercial project has no obligations, or that attribution
          is optional or merely a courtesy.

  - description: negative — small dataset, no tile infrastructure needed
    vars:
      prompt: >
        I'm building a store locator for about 50 locations across the US.
        Do I need to set up a vector tile server for this?
    assert:
      - type: llm-rubric
        value: >
          Must say that 50 locations does NOT require a tile server or any
          tile infrastructure of the user's own — GeoJSON over a hosted
          basemap is sufficient. Must not walk the user through choosing
          between hosted, serverless, and self-hosted tile infrastructure
          for their own data at this size, and must not recommend a PMTiles
          or tile generation pipeline.
