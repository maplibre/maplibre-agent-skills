description: Evals for the maplibre-native-gl-js-parity skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-native-gl-js-parity/SKILL.md

tests:
  - description: explicit — no addProtocol on Native; Android serves app-supplied tile bytes another way
    vars:
      prompt: >
        Android, Kotlin, MapLibre Native. Our vector tiles (MVT) sit in an
        encrypted blob on the device. I want the style JSON to reference them
        as `vault://tiles/{z}/{x}/{y}` and have my own code decrypt each tile
        and hand back the bytes. On the web I do this with
        `maplibregl.addProtocol`. What is the equivalent on Android?
    assert:
      - type: not-icontains
        value: 'HttpRequestHandler'
      - type: llm-rubric
        value: >
          Must state that MapLibre Native has no per-scheme `addProtocol`
          (maplibre-native#3562). Must give at least one Android mechanism that
          exists for this: a custom `HttpRequest` returned by a
          `ModuleProvider` set with `MapLibre.setModuleProvider(...)` (since
          android-v11.0.0), whose `executeRequest(...)` receives the `vault://`
          tile URLs and answers with the decrypted bytes through
          `HttpResponder.onResponse(...)`; or a `CustomVectorSource` (since
          android-v13.5.0) added in code, whose
          `CustomVectorTileProvider.fetchTile(z, x, y)` returns
          `TileData.Mvt(bytes)`. Must not present an invented API as the
          mechanism, such as `MapLibre.addProtocol`, `MapLibreMap.addProtocol`,
          `Style.addProtocol`, or a request-handler interface on a
          `MapLibreOptions` builder. Must not claim
          `FileSource.setResourceTransform` can return tile bytes: it returns a
          replacement URL.

  - description: implicit — globe projection is in no MapLibre Native release
    vars:
      prompt: >
        iOS, Swift, `MLNMapView`. Our style JSON has this at the top level:
        `"projection": {"type": "globe"}`. In the browser the same style
        renders as a globe; in the app the map stays flat however far I zoom
        out. I am on the newest MapLibre iOS from Swift Package Manager. What
        do I change to get the globe?
    assert:
      - type: not-icontains
        value: 'MLNProjectionType'
      - type: not-icontains
        value: 'Projection::Globe'
      - type: llm-rubric
        value: >
          Must state that no released MapLibre Native version has globe
          projection, so the style's `projection` key has no effect on iOS, and
          must name maplibre-native#3161 as the tracking issue rather than an
          invented number. Must not present a globe projection API, property,
          or style setting as working in any MapLibre Native release, and must
          not state or imply a release date or ETA. Must not recommend
          switching to Mapbox's Maps SDK as the fix. Staying on the Mercator
          map, or showing the globe in a web view with MapLibre GL JS, is
          acceptable.

  - description: anti-pattern — porting setTerrain to Kotlin
    vars:
      prompt: >
        I am porting our web map to Android (Kotlin, MapLibre Native). This is
        the web code I need to reproduce: `map.addSource('dem', {type:
        'raster-dem', url: 'https://example.com/terrain.json'})` followed by
        `map.setTerrain({source: 'dem', exaggeration: 1.5})`. Give me the
        Kotlin that does the same thing against `MapLibreMap` / `Style`.
    assert:
      - type: not-icontains
        value: 'android-sdk-extensions'
      - type: llm-rubric
        value: >
          Must state that MapLibre Native has no 3D terrain: no released
          Android version has `setTerrain` or the style's `terrain` block
          (maplibre-native#252). Must not hand back Kotlin that calls a terrain
          API as if it worked, such as `Style.setTerrain`,
          `MapLibreMap.setTerrain`, `TerrainOptions`, or a `Terrain(...)`
          constructor. May offer what does exist from the same `raster-dem`
          source, a `hillshade` layer or a `color-relief` layer (android-v13.0.0
          and later), if it says these shade a flat map rather than raise it.

  - description: implicit — interpolate-hcl drops the layer on Native
    vars:
      prompt: >
        One style JSON, shared between our web app (MapLibre GL JS) and our
        Android app (MapLibre Native). On Android this layer never draws, while
        every other layer in the style is fine and there is no crash: `{"id":
        "density", "type": "fill", "source": "tracts", "source-layer":
        "tracts", "paint": {"fill-color": ["interpolate-hcl", ["linear"],
        ["get", "density"], 0, "#f7fbff", 5000, "#08306b"]}}`. The same style
        is correct in the browser. Where do I look?
    assert:
      - type: not-icontains
        value: 'MapboxLogger'
      - type: not-icontains
        value: 'ignoring paint property'
      - type: not-icontains
        value: 'Expression parsing error'
      - type: llm-rubric
        value: >
          Must identify `interpolate-hcl` as the cause and cite
          maplibre-native#2784: MapLibre Native does not implement
          `interpolate-hcl` or `interpolate-lab`, so the paint value fails to
          parse and the whole layer is dropped, while MapLibre GL JS accepts it.
          Must give the fix: a plain `["interpolate", ["linear"], ...]` ramp,
          with intermediate stops to approximate the HCL path. Must not quote a
          log message MapLibre Native does not emit: for this style it logs
          `[ParseStyle]: value must be a string`, which names neither the layer
          nor the expression. Must not claim any MapLibre Native release
          supports `interpolate-hcl`, and must not answer for Mapbox's Maps SDK.

  - description: explicit — color-relief exists on MapLibre Native
    vars:
      prompt: >
        Android, MapLibre Native (Kotlin). I have Terrarium-encoded DEM tiles
        and I want elevation-banded color under my vector layers — green
        lowlands through brown to white peaks, with the breakpoints in the
        style so our cartographer can tune them. Can I do that in a MapLibre
        Android app, or do I have to pre-render colored raster tiles and ship
        those instead?
    assert:
      - type: icontains
        value: 'color-relief'
      - type: not-icontains
        value: '["band", 0]'
      - type: llm-rubric
        value: >
          Must answer that this works in the style on MapLibre Native, with no
          pre-rendered tiles: a `color-relief` layer on a `raster-dem` source,
          whose `color-relief-color` is an `interpolate` over `["elevation"]`,
          available on Android since android-v13.0.0 (maplibre-native#3965).
          Must not claim elevation coloring is GL JS-only or needs a custom
          layer, and must not build it from `raster-color` or from decoding the
          Terrarium channels in an expression.

  - description: explicit — pmtiles:// is a built-in MapLibre Native scheme
    vars:
      prompt: >
        iOS, Swift, MapLibre Native. Our basemap is one 3 GB `.pmtiles`
        archive on Cloudflare R2. On the web we register the PMTiles protocol
        with the `pmtiles` npm package and point the source at
        `pmtiles://https://...`. What is the iOS equivalent — do I need to
        stand up a tile server, convert the archive to MBTiles, or write a
        custom source?
    assert:
      - type: not-icontains
        value: 'PMTilesArchive'
      - type: not-icontains
        value: 'pmtiles-swift'
      - type: llm-rubric
        value: >
          Must state that MapLibre Native reads PMTiles directly through its
          built-in `pmtiles://` scheme, so no tile server, MBTiles conversion,
          custom source, or protocol registration is needed, and that iOS has
          it since ios-v6.10.0 (maplibre-native#2882). Must show the URL as
          `pmtiles://` in front of the archive's full HTTPS URL, used in the
          style JSON or passed as a string with `MLNVectorTileSource`'s
          `configurationURLString:` initializer; must not build it with
          `URL(string:)` for `configurationURL:`, which breaks it on iOS 17
          (maplibre-native#3151). Must not require the `pmtiles` JavaScript
          package, a Swift PMTiles package, or a `URLProtocol` subclass.

  - description: negative — registering a custom protocol in the browser
    vars:
      prompt: >
        Browser app, MapLibre GL JS, TypeScript. I want to serve vector tiles
        out of an in-browser IndexedDB cache under a `cache://` scheme, so my
        style can reference `cache://tiles/{z}/{x}/{y}`. Show me how to
        register the protocol.
    assert:
      - type: llm-rubric
        value: >
          Answers the browser question directly: registers a handler for the
          `cache` scheme via MapLibre GL JS's `addProtocol` and reads the
          tiles out of IndexedDB in that handler. Does not drag MapLibre
          Native into the answer — no warning that `addProtocol` is missing on
          iOS or Android, no maplibre-native issue links, no note about
          density-independent pixels, no pointer at the js-parity tracker —
          none of which applies to a browser app. Does not claim a custom
          scheme is impossible in MapLibre GL JS or that a server is required.
