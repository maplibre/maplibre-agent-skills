# The pinned generator (model-under-test), referenced from every eval config and TEMPLATE.yaml.
#
# max_tokens never reaches Groq: promptfoo 0.122.0 treats gpt-oss as a reasoning model
# and sends no token cap at all from this key (verified against the request body the
# provider builds; #108). The key stays anyway, as the recorded intent and as the value
# a rename to max_completion_tokens WOULD send. Think before renaming: completions stop
# naturally around 3K tokens, so a 4096 wire cap buys no budget back, and a ceiling Groq
# can see risks the prompt+ceiling rejections that hit 13 of 21 baseline calls at 8192,
# while today's uncapped requests get 200s even with ~5.8K-token prompts (#108).
# Groq truncates mid-sentence at any hard stop, so read the raw completion behind any
# FAIL — see evals/README.md.
id: groq:openai/gpt-oss-120b
label: groq-gpt-oss
config:
  temperature: 0
  max_tokens: 4096
  # The reasoning trace is not part of the answer, so it is excluded from the graded output:
  # assertions and the judge grade the answer only. The model still reasons; budget unchanged.
  showThinking: false
