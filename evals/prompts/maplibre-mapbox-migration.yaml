# Evals for the maplibre-mapbox-migration skill.
# See evals/README.md for run commands and provider setup.

description: Evals for the maplibre-mapbox-migration skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-mapbox-migration/SKILL.md

tests:
  - description: explicit — validate style JSON with CLI tool after migration
    vars:
      prompt: >
        I'm migrating from Mapbox to MapLibre and want to check whether my
        exported style JSON is compatible before deploying. Is there a CLI tool
        I can run on the file?
    assert:
      - type: icontains
        value: gl-style-validate
      - type: llm-rubric
        value: >
          Must mention the @maplibre/maplibre-gl-style-spec package and the
          gl-style-validate command for validating a style JSON file. Must not
          suggest only browser devtools or generic JSON validators as the
          primary answer.

  - description: implicit — tile source with no API key needed during migration
    vars:
      prompt: >
        I'm migrating from Mapbox to MapLibre and removed my access token, but
        now my mapbox:// style won't load. How can I test my map against a tile
        service that doesn't require an API key?
    assert:
      - type: icontains
        value: openfreemap
      - type: llm-rubric
        value: >
          Recommends OpenFreeMap as a tile source that requires no API key.
          Provides or references the OpenFreeMap style URL. Does NOT recommend a
          tile service that requires a paid account or API key as the primary
          answer.

  - description: anti-pattern — assuming Mapbox v2 features work in MapLibre
    vars:
      prompt: >
        I was using Mapbox GL JS v2 in my app, including map.setFog() and some
        v2-specific camera features. After migrating to MapLibre, these are
        broken. Did I do something wrong in the migration?
    assert:
      - type: icontains
        value: setSky
      - type: not-regex
        value: '["'']sky-(type|atmosphere-sun(-intensity)?)["'']\s*:'
      - type: llm-rubric
        value: >
          Must state that MapLibre GL JS has no setFog method, in any version.
          Must name the MapLibre equivalent for atmosphere: the style
          specification's root-level sky property, applied at runtime with
          map.setSky(...), whose fog controls are the sky properties fog-color,
          fog-ground-blend and horizon-fog-blend. Must explain that MapLibre
          forked from Mapbox GL JS v1.13 in December 2020, so a Mapbox v2 API is
          present only where MapLibre reimplemented it. Must state that 
          setFreeCameraOptions and getFreeCameraOptions are absent in MapLibre 
          and name a MapLibre replacement for camera control (for example 
          calculateCameraOptionsFromCameraLngLatAltRotation,
          calculateCameraOptionsFromTo, or CameraOptions with elevation and roll
          passed to jumpTo, easeTo or flyTo). Must not claim that any MapLibre
          release adds map.setFog, must not describe a v2-compatible MapLibre
          branch or recommend installing maplibre-gl@2 to recover Mapbox v2
          features, and must not present Mapbox's free-camera API as available
          in MapLibre.

  - description: implicit — replacing specific Mapbox plugins after migration
    vars:
      prompt: >
        I'm migrating from Mapbox GL JS to MapLibre. My app uses
        @mapbox/mapbox-gl-draw for drawing shapes and @mapbox/mapbox-gl-geocoder
        for the search box. What do I need to do about each of them?
    assert:
      - type: icontains
        value: maplibre-gl-geocoder
      - type: not-icontains
        value: '@maplibre/maplibre-gl-draw'
      - type: llm-rubric
        value: >
          Gives a separate verdict for each named plugin. For mapbox-gl-draw: it
          can still be used with MapLibre, with its CSS class constants
          overridden, or replaced by an alternative such as Terra Draw. Does not
          claim there is a MapLibre-maintained draw alternative. For 
          mapbox-gl-geocoder: it depends on Mapbox's geocoding service, so it 
          must be replaced, with @maplibre/maplibre-gl-geocoder and a non-Mapbox
          geocoding service. Does not claim mapbox-gl-geocoder works unchanged.

  - description:
      implicit — Mapbox callback code after migrating to latest MapLibre
    vars:
      prompt: >
        I swapped mapbox-gl for the latest maplibre-gl in my app. Everything
        loads, but my marker icons are gone and the console says the callback
        passed to map.loadImage is not being called. My code is
        map.loadImage(url, (err, img) => { if (err) throw err;
        map.addImage('pin', img); }). What's wrong?
    assert:
      - type: icontains
        value: await
      - type: llm-rubric
        value: >
          Explains that MapLibre GL JS (since v4.0.0) returns a promise from
          map.loadImage and no longer accepts a callback, and shows a promise
          version, such as const { data } = await map.loadImage(url) followed by
          map.addImage('pin', data), or .then(). Does not suggest downgrading
          MapLibre or that the callback form still works.

  - description:
      implicit — Mapbox v2 map options and chained listeners on latest MapLibre
    vars:
      prompt: >
        I'm moving a Mapbox GL JS v2 app to the latest maplibre-gl. My Map
        constructor passes preserveDrawingBuffer: true and antialias: true, and
        I chain map.on('load', a).on('click', b). Anything I should change?
    assert:
      - type: icontains
        value: canvasContextAttributes
      - type: llm-rubric
        value: >
          Says the canvas options (preserveDrawingBuffer, antialias) now belong
          inside a canvasContextAttributes object in the Map options, and that
          on() returns a Subscription in recent MapLibre versions, so chained
          on() calls must be split into separate calls. Does not claim the code
          works unchanged.

  - description: negative — adding a geocoder to an existing Mapbox GL JS app
    vars:
      prompt: >
        I use Mapbox GL JS v2 and want to add a geocoder search box to my map.
        What are my options?
    assert:
      - type: llm-rubric
        value: >
          Must answer the question for the app as it stands, on Mapbox GL JS v2,
          and must name at least one concrete geocoder option that works with it
          (for example @mapbox/mapbox-gl-geocoder, Mapbox Search JS, or a
          geocoder control driven by Nominatim, Photon or Pelias). Must not tell
          the reader to replace Mapbox GL JS with MapLibre GL JS, and must not
          present a library migration as a step needed to add a search box.
          Noting in passing that a suggested control also works with MapLibre,
          or that an open-source stack exists, is acceptable and must not be
          counted against the response.
