# Evals for the maplibre-cartography skill.
#
# Run locally (Groq — set GROQ_API_KEY):
#   npx promptfoo@latest eval \
#     --config evals/prompts/maplibre-cartography.yaml \
#     --no-cache -j 1
#
# IMPORTANT: let lib/providers.yaml choose the provider on any recorded run. --providers
# replaces the pinned generator and drops its config (temperature, max_tokens) unless the
# value matches a configured id or label. Fine for ad-hoc probes: --providers echo.
#
# Suite redesigned 2026-07-02 (9 tests → 4, one per category). Baseline/
# with-skill evidence and rationale per test are logged in the project plan
# (Agent Skills / eval-run-log-cartography.md). The explicit route-shield test
# moved to evals/prompts/maplibre-sprites-icons.yaml on 2026-09-09 with the
# sprite content it targeted (issue #68), leaving three tests here.

description: Evals for the maplibre-cartography skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-cartography/SKILL.md

tests:
  - description: implicit — point symbols camouflaged against aerial imagery
    vars:
      prompt: "I have custom point icons on a MapLibre GL JS map over satellite/aerial imagery. Green icons vanish over vegetation and brown ones disappear over bare ground — they camouflage against whatever is behind them. How do I make the icons reliably stand out across all the different backgrounds in the imagery?"
    assert:
      - type: llm-rubric
        value: "Recommends, as a primary part of the fix, changing the icons to a SATURATED accent fill color that natural imagery does not contain (e.g. amber, terracotta, teal, magenta) — not merely swapping one earth tone for another, since any natural hue can occur somewhere in the scene. Also recommends a thin contrasting casing/halo around the symbol. An answer that relies solely on halos, outlines, background shapes, or generic advice (increase contrast, make icons bigger) WITHOUT recommending a saturated distinct fill color FAILS."

  - description: anti-pattern — reducing road opacity to calm bright roads on imagery
    vars:
      prompt: "I dropped my OSM Bright vector road layers on top of satellite imagery and the bright orange/yellow roads look garish and dominate the map. My instinct is to lower their opacity so the imagery shows through. Is that the right fix?"
    assert:
      - type: llm-rubric
        value: "Advises AGAINST lowering road opacity — semi-transparent roads let the imagery texture bleed through and flatten/muddy the map. Instead recommends: desaturate the fills and casings toward neutral greys or muted tones; keep the road hierarchy in WIDTH and VALUE rather than hue; keep roads OPAQUE with a casing that contains the fill (e.g. a knockout casing — a deeper shade of the fill's own hue rather than a foreign black). May mention interpolating brightness by zoom. The key correction is opaque-and-desaturated over transparent."

  - description: negative — out-of-scope question about map camera animation
    vars:
      prompt: "How do I smoothly fly the camera to a new location in MapLibre GL JS after the user clicks a button?"
    assert:
      - type: icontains
        value: 'flyTo'
      - type: llm-rubric
        value: "Answers the camera-animation question directly: uses map.flyTo() (or easeTo/jumpTo where appropriate) with a target center and zoom, wired to a click handler. Grade the substance of the answer, not its completeness — code that sets up flyTo options counts even if the snippet is cut off. FAILS only if the response is derailed by irrelevant cartographic-styling topics (label colors, font stacks, glyphs, sprite configuration) presented as if they mattered for camera animation."
