# Evals for the maplibre-terrain-rendering skill.
# Run commands and provider setup: evals/README.md
# Per-test verdicts and what has not been run: evals/results/maplibre-terrain-rendering.md
#
# Tests 1-3 are carried over from evals/prompts/maplibre-terrain-patterns.yaml,
# where each failed at baseline on 2026-08-28.

description: Evals for the maplibre-terrain-rendering skill

prompts:
  - file://lib/skill-prompt.mjs

providers:
  - file://lib/providers.yaml

evaluateOptions:
  delay: 500

defaultTest:
  vars:
    skillFile: skills/maplibre-terrain-rendering/SKILL.md

tests:
  - description: explicit — client-side hypsometric tint (color-relief layer, GL JS 5.6+)
    vars:
      prompt: >
        I have terrain tiles as a raster-dem source in MapLibre GL JS and I
        want to color the map by elevation ranges (a hypsometric tint) directly
        client-side — blues at sea level through greens and browns to white
        peaks — without pre-rendering colored raster tiles. What layer type do
        I use and how do I configure the color ramp?
    assert:
      - type: icontains
        value: 'color-relief'
      - type: llm-rubric
        value: >
          Must name the `color-relief` layer type (MapLibre GL JS 5.6) as the
          answer, reading from the raster-dem source. Must configure the ramp
          with the `color-relief-color` paint property using an `interpolate`
          expression whose input is the `["elevation"]` expression. Must not
          present `raster-color`, `raster-value`, or `raster-color-mix` as
          MapLibre properties, must not claim client-side elevation coloring is
          impossible in MapLibre, and must not offer pre-rendered raster tiles
          or a hillshade layer as the primary answer.

  - description: implicit — runtime contour generation, off-the-shelf vs DIY
    vars:
      prompt: >
        I want contour lines on my MapLibre GL JS map, generated at runtime
        from a raster-dem elevation source, rather than pre-rendering a
        separate vector contour tileset ahead of time. Is this possible, and
        how would I approach it?
    assert:
      - type: icontains
        value: 'maplibre-contour'
      # The baseline answer's DIY pipeline: geotiff.js decoding into a
      # marching-squares implementation, presented as the primary approach.
      # All three spellings the model uses for it.
      - type: not-icontains
        value: 'marchingsquares'
      - type: not-icontains
        value: 'marching-squares'
      - type: not-icontains
        value: 'marching squares'
      - type: llm-rubric
        value: >
          Must name `maplibre-contour` as an existing library that generates
          vector contour tiles at runtime from a raster-dem source. Must show
          that the integration is a few lines of setup: constructing a
          `DemSource` with the DEM tile URL and its `encoding`, registering it
          with MapLibre, and adding a vector source whose tiles come from that
          protocol. Must not direct the developer to build the pipeline
          themselves — decoding DEM pixels by hand, implementing an isoline
          algorithm, or reaching for a generic geometry library — as the
          primary approach.

  - description: anti-pattern — stacking hillshade layers for multi-directional shading
    vars:
      prompt: >
        My single hillshade layer in MapLibre GL JS looks harsh, how do I fix it?
    assert:
      # Deterministic tripwire: hillshade-method shipped in GL JS 5.5.0 (2025),
      # post-cutoff — baseline endorses stacking (the only pre-5.5 technique).
      - type: icontains
        value: 'hillshade-method'
      # Invented in the baseline answer's tuning table; no such MapLibre property.
      - type: not-icontains
        value: 'hillshade-ambient-occlusion-intensity'
      - type: llm-rubric
        value: >
          Must recommend the `hillshade-method` paint property on the single
          existing layer — `"igor"` or `"multidirectional"` — as the first move
          against harshness, and may additionally name real softening levers
          (`hillshade-exaggeration`, `hillshade-shadow-color` and
          `hillshade-highlight-color` with alpha). Must not recommend stacking
          several hillshade layers at different illumination directions, in the
          primary answer or as an optional extra, and must not invent paint
          properties that MapLibre's style specification does not define.

  - description: implicit — nothing above the horizon once the camera is pitched
    vars:
      prompt: >
        My MapLibre GL JS map has 3D terrain enabled and the camera pitched to
        70 degrees. The relief looks right, but everything above the horizon
        line is the flat page background. I want an actual sky and some haze
        where the ground meets it. How do I set that up?
    assert:
      - type: llm-rubric
        value: >
          Must state that in MapLibre GL JS the sky is style-level
          configuration, not a layer: a root-level `sky` object in the style, or
          the `map.setSky()` method. Must name real keys from that object, such
          as `sky-color`, `horizon-color`, `fog-color`, `sky-horizon-blend`,
          `horizon-fog-blend`, or `fog-ground-blend`. Must not instruct the
          developer to call `map.addLayer` with `type: "sky"`, and must not
          present `sky-type`, `sky-atmosphere-sun`, or
          `sky-atmosphere-sun-intensity` as MapLibre properties.

  - description: negative — adjacent question, a pre-rendered shaded-relief raster basemap
    vars:
      prompt: >
        I licensed a beautiful pre-rendered shaded-relief basemap, served as
        ordinary JPEG raster tiles. I want it under my vector data layers with
        the labels still on top. How do I add it?
    assert:
      - type: llm-rubric
        value: >
          Must answer the question asked: add it as a `raster` source and a
          `raster` layer, inserted beneath the existing data and label layers
          (the layer list draws bottom to top, so `map.addLayer` takes the id of
          the layer it should sit below as its second argument). Must not tell
          the developer that this needs a `raster-dem` source, a `hillshade` or
          `color-relief` layer, or `setTerrain` — the relief is already baked
          into the imagery.
